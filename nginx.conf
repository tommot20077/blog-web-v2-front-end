# 前端靜態站 nginx 設定（被 COPY 至 /etc/nginx/conf.d/default.conf）。
#
# 部署拓撲：正式環境與後端同域 https://90030.xyz，由外部反向代理 / ingress
# 負責將 /api 導到後端(:9010)、/ 導到本容器的靜態站。
# 因此本檔「不」自帶 /api proxy（避免雙重代理與設定漂移）。
# 若改採「單容器自帶 proxy」拓撲，見檔末註解的可選 proxy 區塊。

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- 壓縮 ----------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- Content-Security-Policy（強制）-------------------------------
    # 決策 A2（Yuan，2026-11-07）：用 Playwright E2E 收集 CSP 違規，零違規後切換為強制，不建收報端點。
    # 先前以 Report-Only 上線觀察；E2E（e2e/csp/csp-violations.spec.ts，npm run test:e2e:csp）以本檔
    # 解析出的同一串政策供應 mock 模式的正式建置，走過首頁、文章列表 / 詳情、標籤、作者、搜尋、登入 / 註冊、
    # 編輯器（CodeMirror 輸入、Shiki 程式碼高亮預覽、內文圖片）、設定頁（頭像 blob: 預覽）、我的文章與後台各頁，
    # 並同時收集 securitypolicyviolation 事件與 console 訊息，Report-Only 狀態下違規數為 0，因此改為強制。
    # 政策一改，該 E2E 會用新政策重跑（CI 的 e2e-tests job），違規即紅燈。
    #
    # 政策從嚴開始，只放行實際需要的來源（依據：index.html、src/、dist/index.html 的實際用法）：
    #   default-src 'self'      預設只允許同源。
    #   script-src 'self'       Vite 產物只有外部 module script（/assets/*.js），沒有 inline script；
    #                           不開 'unsafe-inline' / 'unsafe-eval'。JSON-LD 為 type=application/ld+json
    #                           的資料區塊，不屬於 script-src 管轄。
    #   style-src 'self' https://fonts.googleapis.com
    #                           Vite 產出的 /assets/*.css 為同源；index.html 以 <link> 載入 Google Fonts 樣式表。
    #   style-src-elem ... 'unsafe-inline'
    #                           CodeMirror 6（編輯器）執行期會插入 <style> 元素（style-mod）。
    #                           待編輯器改用 EditorView.cspNonce 後可拿掉。
    #   style-src-attr 'unsafe-inline'
    #                           Shiki 程式碼高亮以 v-html 輸出 style="--shiki-*:…"，Vue 模板亦有靜態 style 屬性。
    #                           （useMarkdownRenderer 已限制 style 只留在 pre.shiki，見 XSS-02 修補。）
    #   font-src 'self' https://fonts.gstatic.com
    #                           Google Fonts 的實際字型檔來自 fonts.gstatic.com。
    #   img-src 'self' blob:    封面 / 內文 / 頭像為相對路徑 /api/v1/files/{id}/content（同源）；
    #                           useAuthedImages 與頭像預覽會改用 blob: URL。
    #                           圖片由後端同源串流（/api/v1/files/{id}/content 不再 302 導向物件儲存），
    #                           物件儲存不對外，img-src 維持 'self' blob:。已刻意不放 data:，先觀察是否真有需要。
    #                           外部圖片（作者貼外部圖床網址）刻意不放行（Yuan 2026-11-07 決定，CSP 維持嚴格）：
    #                           讀者端會破圖，因此編輯器偵測到內文含外部圖片時會顯示警告，請作者改用上傳插圖。
    #                           data: 內嵌圖片同樣不放行，編輯器一併警告。
    #   connect-src 'self'      XHR/axios 呼叫後端 API：正式建置用同網域相對路徑（/api/**，.env.production
    #                           不設定 VITE_API_BASE_URL），不需要放行其他網域。
    #                           正式環境與站台同源，此處明列是為了在別的網域預覽 / 本機 fullstack
    #                           （API 在 localhost:9010）時違規訊息能一眼看出差異。
    #   frame-src 'none'        useMarkdownRenderer 已移除 iframe，站內沒有任何嵌入框架。
    #   object-src 'none'       不使用 <object> / <embed> / <applet>。
    #   base-uri 'self'         防止注入 <base> 改寫相對路徑。
    #   form-action 'self'      表單只送往同源。
    #   frame-ancestors 'self'  與下方 X-Frame-Options: SAMEORIGIN 一致。
    #
    # report-uri / report-to：依決策 A2 不建收報端點，故不設（違規會顯示在瀏覽器 console）。
    #
    # 注意：nginx 的 add_header 只要在子層（location）宣告過，就不會繼承上層；
    # 因此 index.html 的 location 也必須再宣告一次（SPA fallback 最終都落到那裡）。
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-elem 'self' https://fonts.googleapis.com 'unsafe-inline'; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    add_header Content-Security-Policy $csp always;

    # ---- 全域安全標頭（HTML 與資源皆套用）----------------------------
    # 注意：HSTS 通常交由外部 ingress 統一下發以免衝突，故此處從略；
    # CSP 為強制版（見上方）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ---- 帶 hash 的不可變資源：長快取 --------------------------------
    # 注意：以下兩個 location 自己宣告了 add_header，不會繼承 server 層的安全標頭，
    # 故 X-Frame-Options / Referrer-Policy / CSP 在各 location 重複宣告（改政策時只改上方 $csp 變數）。
    # Vite 產物落在 /assets/ 且檔名含 content hash，可安全長快取。
    location /assets/ {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- 其他靜態資源（favicon / svg / 字型等）：中等快取 ------------
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---- SPA history fallback ----------------------------------------
    # vue-router 使用 createWebHistory，深連結 / 重新整理須回退至 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不可快取，確保部署後使用者立即拿到新版（指向新 hash 資源）。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    # 不洩漏 nginx 版本。
    server_tokens off;

    # ---- 可選：單容器自帶 /api proxy --------------------------------
    # 若不使用外部 ingress 而希望此容器同時代理後端，移除上方說明的雙代理疑慮後，
    # 取消以下註解並把 backend 換成實際後端位址（如 backend:9010）。
    #
    # location /api/ {
    #     proxy_pass         http://backend:9010;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }
}
