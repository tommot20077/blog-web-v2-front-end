# 前端靜態站 nginx 設定（被 COPY 至 /etc/nginx/conf.d/default.conf）。
#
# 部署拓撲：正式環境與後端同域 https://90030.xyz，由外部反向代理 / ingress
# 負責將 /api 導到後端(:9010)、/ 導到本容器的靜態站。
# 因此本檔「不」自帶 /api proxy（避免雙重代理與設定漂移）。
# 若改採「單容器自帶 proxy」拓撲，見檔末註解的可選 proxy 區塊。

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- 壓縮 ----------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- 全域安全標頭（HTML 與資源皆套用）----------------------------
    # 注意：HSTS / CSP 通常交由外部 ingress 統一下發以免衝突，故此處從略。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ---- 帶 hash 的不可變資源：長快取 --------------------------------
    # Vite 產物落在 /assets/ 且檔名含 content hash，可安全長快取。
    location /assets/ {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- 其他靜態資源（favicon / svg / 字型等）：中等快取 ------------
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---- SPA history fallback ----------------------------------------
    # vue-router 使用 createWebHistory，深連結 / 重新整理須回退至 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不可快取，確保部署後使用者立即拿到新版（指向新 hash 資源）。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # 不洩漏 nginx 版本。
    server_tokens off;

    # ---- 可選：單容器自帶 /api proxy --------------------------------
    # 若不使用外部 ingress 而希望此容器同時代理後端，移除上方說明的雙代理疑慮後，
    # 取消以下註解並把 backend 換成實際後端位址（如 backend:9010）。
    #
    # location /api/ {
    #     proxy_pass         http://backend:9010;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }
}
