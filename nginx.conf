# 前端靜態站 nginx 設定（被 COPY 至 /etc/nginx/conf.d/default.conf）。
#
# 部署拓撲：正式環境與後端同域 https://90030.xyz，由外部反向代理 / ingress
# 負責將 /api 導到後端(:9010)、/ 導到本容器的靜態站。
# 因此本檔「不」自帶 /api proxy（避免雙重代理與設定漂移）。
# 若改採「單容器自帶 proxy」拓撲，見檔末註解的可選 proxy 區塊。

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- 壓縮 ----------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- Content-Security-Policy-Report-Only --------------------------
    # 先以 Report-Only 上線觀察（決策紀錄 §3：「CSP 另立一項，先以 Report-Only 上線」）：
    # 違規只會出現在瀏覽器 console / report 端點，不會阻擋任何載入。觀察穩定後再改為強制版
    # （Content-Security-Policy）並移除本段的 Report-Only 字樣。
    #
    # 政策從嚴開始，只放行實際需要的來源（依據：index.html、src/、dist/index.html 的實際用法）：
    #   default-src 'self'      預設只允許同源。
    #   script-src 'self'       Vite 產物只有外部 module script（/assets/*.js），沒有 inline script；
    #                           不開 'unsafe-inline' / 'unsafe-eval'。JSON-LD 為 type=application/ld+json
    #                           的資料區塊，不屬於 script-src 管轄。
    #   style-src 'self' https://fonts.googleapis.com
    #                           Vite 產出的 /assets/*.css 為同源；index.html 以 <link> 載入 Google Fonts 樣式表。
    #   style-src-elem ... 'unsafe-inline'
    #                           CodeMirror 6（編輯器）執行期會插入 <style> 元素（style-mod）。
    #                           待編輯器改用 EditorView.cspNonce 後可拿掉。
    #   style-src-attr 'unsafe-inline'
    #                           Shiki 程式碼高亮以 v-html 輸出 style="--shiki-*:…"，Vue 模板亦有靜態 style 屬性。
    #                           （useMarkdownRenderer 已限制 style 只留在 pre.shiki，見 XSS-02 修補。）
    #   font-src 'self' https://fonts.gstatic.com
    #                           Google Fonts 的實際字型檔來自 fonts.gstatic.com。
    #   img-src 'self' blob:    封面 / 內文 / 頭像為相對路徑 /api/v1/files/{id}/content（同源）；
    #                           useAuthedImages 與頭像預覽會改用 blob: URL。
    #                           圖片由後端同源串流（/api/v1/files/{id}/content 不再 302 導向物件儲存），
    #                           物件儲存不對外，img-src 維持 'self' blob:。已刻意不放 data:，先觀察是否真有需要。
    #   connect-src 'self' https://90030.xyz
    #                           XHR/axios 呼叫後端 API；VITE_API_BASE_URL=https://90030.xyz（.env.production）。
    #                           正式環境與站台同源，此處明列是為了在別的網域預覽 / 本機 fullstack
    #                           （API 在 localhost:9010）時違規訊息能一眼看出差異。
    #   frame-src 'none'        useMarkdownRenderer 已移除 iframe，站內沒有任何嵌入框架。
    #   object-src 'none'       不使用 <object> / <embed> / <applet>。
    #   base-uri 'self'         防止注入 <base> 改寫相對路徑。
    #   form-action 'self'      表單只送往同源。
    #   frame-ancestors 'self'  與下方 X-Frame-Options: SAMEORIGIN 一致。
    #
    # report-uri / report-to：後端目前沒有 CSP 回報接收端點，故先不設（違規仍會顯示在瀏覽器 console）。
    # 需要集中蒐集時再加（需先在後端或 ingress 提供接收端點）。
    #
    # 注意：nginx 的 add_header 只要在子層（location）宣告過，就不會繼承上層；
    # 因此 index.html 的 location 也必須再宣告一次（SPA fallback 最終都落到那裡）。
    set $csp_report_only "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-elem 'self' https://fonts.googleapis.com 'unsafe-inline'; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob:; connect-src 'self' https://90030.xyz; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    add_header Content-Security-Policy-Report-Only $csp_report_only always;

    # ---- 全域安全標頭（HTML 與資源皆套用）----------------------------
    # 注意：HSTS 通常交由外部 ingress 統一下發以免衝突，故此處從略；
    # CSP 目前僅 Report-Only（見上方），強制版待觀察後再上。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ---- 帶 hash 的不可變資源：長快取 --------------------------------
    # Vite 產物落在 /assets/ 且檔名含 content hash，可安全長快取。
    location /assets/ {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- 其他靜態資源（favicon / svg / 字型等）：中等快取 ------------
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---- SPA history fallback ----------------------------------------
    # vue-router 使用 createWebHistory，深連結 / 重新整理須回退至 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不可快取，確保部署後使用者立即拿到新版（指向新 hash 資源）。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only $csp_report_only always;
    }

    # 不洩漏 nginx 版本。
    server_tokens off;

    # ---- 可選：單容器自帶 /api proxy --------------------------------
    # 若不使用外部 ingress 而希望此容器同時代理後端，移除上方說明的雙代理疑慮後，
    # 取消以下註解並把 backend 換成實際後端位址（如 backend:9010）。
    #
    # location /api/ {
    #     proxy_pass         http://backend:9010;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }
}
