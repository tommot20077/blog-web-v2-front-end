name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-and-component-tests, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:mock
        env:
          CI: true
          E2E_MOCK: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  e2e-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'
    needs: [unit-and-component-tests, build]
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: tommot20077/blog-web-v2
          path: backend

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build backend JAR
        working-directory: backend
        run: ./mvnw -B clean package -DskipTests --no-transfer-progress

      - name: Build backend Docker image
        working-directory: backend
        run: docker build -t blog-backend:e2e .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Wait for backend healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9010/actuator/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 5
          done
          echo "Backend failed to become healthy"
          docker compose -f docker-compose.e2e.yml logs backend
          exit 1

      - name: Run E2E tests (real backend)
        run: npm run test:e2e:ci
        env:
          CI: true
          VITE_API_BASE_URL: http://localhost:9010

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integration
          path: playwright-report/
          retention-days: 14

      - name: Capture E2E stack logs
        if: failure()
        run: |
          mkdir -p e2e-artifacts
          docker compose -f docker-compose.e2e.yml logs --no-color > e2e-artifacts/docker-compose.log

      - name: Upload E2E stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-logs
          path: e2e-artifacts/
          retention-days: 14

      - name: Tear down E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # 匯總 job：branch ruleset 的 required status check 指向這一個 job，
  # 之後增減 CI job 時只需改本檔的 needs，不必同步改 repo ruleset 設定。
  # 注意 e2e-integration 只在 pull_request 事件執行（push 時為 skipped），
  # 故 skipped 視為通過；其餘任何非 success 一律擋下。
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [unit-and-component-tests, build, coverage, e2e-tests, e2e-integration]
    if: always()
    steps:
      - name: Verify all required checks passed
        run: |
          declare -A results=(
            [unit-and-component-tests]="${{ needs.unit-and-component-tests.result }}"
            [build]="${{ needs.build.result }}"
            [coverage]="${{ needs.coverage.result }}"
            [e2e-tests]="${{ needs.e2e-tests.result }}"
            [e2e-integration]="${{ needs.e2e-integration.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
              echo "OK       $job: $result"
            else
              echo "FAILED   $job: $result"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more required checks did not pass"
            exit 1
          fi
          echo "All required checks passed"
